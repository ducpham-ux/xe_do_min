; Firmware xe dò line phát hiện & gắp rác đỏ - STM32F103C8T6 (Blue Pill)
; Nạp:  pio run -e bluepill -t upload      (mạch nạp ST-Link V2)
; Vòng 2 (có cơ cấu gắp): pio run -e bluepill_gripper -t upload

[platformio]
default_envs = bluepill

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_flags =
  -Wall
  -Os
  -Wl,-u,_printf_float      ; cho phép snprintf in số thực trong log

[env:bluepill]

[env:bluepill_gripper]
build_flags =
  ${env.build_flags}
  -DENABLE_GRIPPER=1
